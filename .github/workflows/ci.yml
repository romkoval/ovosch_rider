name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: 4.7-stable

jobs:
  tests:
    name: GUT tests (Godot ${{ env.GODOT_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Project opens headless
        run: ~/godot/godot --headless --path . --import

      - name: Run GUT tests
        run: GODOT=~/godot/godot ./scripts/test.sh

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit
          path: tests/reports/results.xml
          if-no-files-found: ignore
