name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Workflow только читает репозиторий (артефакты и кэш работают через свой токен раннера).
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable

jobs:
  tests:
    name: GUT tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # полная история для проверки сообщений коммитов (REQ-INF-03 крит. 2)

      - name: Secrets scan
        run: ./scripts/check_secrets.sh

      - name: Commit messages contain REQ-ID
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            # checkout с fetch-depth: 0 уже содержит базу; догружаем, только если её нет.
            if ! git rev-parse --verify -q "origin/$BASE_REF" >/dev/null; then
              git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF" \
                || echo "не удалось получить origin/$BASE_REF" >&2
            fi
            RANGE="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="HEAD~0..HEAD"
          fi
          ./scripts/check_commit_messages.sh "$RANGE"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # godot --import возвращает 0 и при ошибках скриптов — валим шаг по логу.
      - name: Project opens headless
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource" import.log; then exit 1; fi

      - name: Run GUT tests
        run: GODOT=~/godot/godot ./scripts/test.sh

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit
          path: tests/reports/results.xml
          if-no-files-found: ignore

  native-linux:
    name: Native BLE skeleton builds (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    env:
      GODOT_CPP_BRANCH: "4.5"  # ветки 4.7 в godot-cpp пока нет; см. native/ble/README.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      # HEAD ветки godot-cpp входит в ключ кэша: новый коммит в ветке → пересборка.
      - name: Resolve godot-cpp HEAD
        id: godot-cpp-rev
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/godotengine/godot-cpp "refs/heads/$GODOT_CPP_BRANCH" | cut -f1)"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp (sources + built objects)
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: native/ble/godot-cpp
          key: godot-cpp-${{ env.GODOT_CPP_BRANCH }}-${{ steps.godot-cpp-rev.outputs.sha }}-linux-v2-${{ hashFiles('native/ble/SConstruct') }}

      - name: Clone godot-cpp
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: git clone --depth 1 -b "$GODOT_CPP_BRANCH" https://github.com/godotengine/godot-cpp native/ble/godot-cpp

      # godot-cpp собирается в своём каталоге (относительные пути): при сборке
      # через наш SConstruct список объектов с абсолютными путями превышает
      # лимит аргументов shell при линковке статической библиотеки.
      - name: Build godot-cpp
        working-directory: native/ble/godot-cpp
        run: scons platform=linux target=template_debug -j4

      - name: Build GDExtension skeleton
        working-directory: native/ble
        run: scons platform=linux target=template_debug -j4

      - name: Library produced
        run: ls -l native/ble/bin/ && test -f native/ble/bin/libovosch_ble.linux.template_debug.x86_64.so

  native-macos:
    name: Native BLE (CoreBluetooth) builds (macos, ${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # template_debug — для загрузки расширения редактором (проверка контракта),
        # template_release — для экспорта приложения.
        target: [template_debug, template_release]
    env:
      GODOT_CPP_BRANCH: "4.5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      # HEAD ветки godot-cpp входит в ключ кэша: новый коммит в ветке → пересборка.
      - name: Resolve godot-cpp HEAD
        id: godot-cpp-rev
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/godotengine/godot-cpp "refs/heads/$GODOT_CPP_BRANCH" | cut -f1)"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp (sources + built objects)
        id: cache-godot-cpp
        uses: actions/cache@v4
        with:
          path: native/ble/godot-cpp
          key: godot-cpp-${{ env.GODOT_CPP_BRANCH }}-${{ steps.godot-cpp-rev.outputs.sha }}-macos-universal-${{ matrix.target }}-${{ hashFiles('native/ble/SConstruct') }}

      - name: Clone godot-cpp
        if: steps.cache-godot-cpp.outputs.cache-hit != 'true'
        run: git clone --depth 1 -b "$GODOT_CPP_BRANCH" https://github.com/godotengine/godot-cpp native/ble/godot-cpp

      # godot-cpp собирается в своём каталоге (иначе ar получает абсолютные пути объектов и
      # падает с «Argument list too long»), затем — расширение. arch=universal: x86_64 + arm64.
      - name: Build godot-cpp
        working-directory: native/ble/godot-cpp
        run: scons platform=macos target=${{ matrix.target }} arch=universal -j4

      - name: Build GDExtension with CoreBluetooth backend
        working-directory: native/ble
        run: scons platform=macos target=${{ matrix.target }} arch=universal -j4

      - name: Framework produced (universal, with Info.plist)
        run: |
          set -euo pipefail
          FW=native/ble/bin/libovosch_ble.macos.${{ matrix.target }}.framework
          test -f "$FW/libovosch_ble.macos.${{ matrix.target }}"
          test -f "$FW/Resources/Info.plist"
          plutil -lint "$FW/Resources/Info.plist"
          lipo -info "$FW/libovosch_ble.macos.${{ matrix.target }}" | tee /dev/stderr | grep -q "x86_64 arm64"

      # tar сохраняет права и структуру бандла (upload-artifact их не хранит).
      - name: Pack framework
        run: tar -czf ovosch-ble-macos-${{ matrix.target }}.tar.gz -C native/ble bin

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: ovosch-ble-macos-${{ matrix.target }}
          path: ovosch-ble-macos-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  macos-app:
    name: macOS app export (universal, ad-hoc signed)
    runs-on: macos-latest
    needs: [tests, native-macos]
    timeout-minutes: 30
    env:
      BUNDLE_ID: io.github.romkoval.ovosch-rider
    steps:
      - uses: actions/checkout@v4

      - name: Download BLE frameworks
        uses: actions/download-artifact@v4
        with:
          pattern: ovosch-ble-macos-*
          path: ble-artifacts
          merge-multiple: true

      - name: Install BLE frameworks
        run: |
          set -euo pipefail
          for f in ble-artifacts/*.tar.gz; do tar -xzf "$f" -C native/ble; done
          ls -R native/ble/bin
          # native/ скрыт от Godot файлом .gdignore, пока библиотеки не собраны;
          # здесь они есть — открываем каталог, чтобы расширение загрузилось и попало в экспорт.
          rm native/.gdignore

      - name: Cache Godot editor and macOS export template
        id: cache-godot-macos
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-macos
            ~/godot-templates
          key: godot-${{ env.GODOT_VERSION }}-macos-editor-and-template

      - name: Download Godot editor and macOS export template
        if: steps.cache-godot-macos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-macos ~/godot-templates
          curl -sSL -o godot-macos.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot-macos.zip -d ~/godot-macos
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -j templates.tpz "templates/macos.zip" "templates/version.txt" -d ~/godot-templates
          rm -f godot-macos.zip templates.tpz

      - name: Install export template
        run: |
          set -euo pipefail
          VERSION_DIR="$(cat ~/godot-templates/version.txt)"
          DEST="$HOME/Library/Application Support/Godot/export_templates/$VERSION_DIR"
          mkdir -p "$DEST"
          cp ~/godot-templates/macos.zip ~/godot-templates/version.txt "$DEST/"
          echo "GODOT=$HOME/godot-macos/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Project opens headless with native BLE
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed loading resource|Can't open dynamic library|GDExtension.*(failed|error)" import.log; then exit 1; fi

      - name: Native BLE loads and matches BleBridge contract
        run: '"$GODOT" --headless --path . --script res://scripts/ci/check_native_ble.gd'

      - name: Generate export preset
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^config\/version="\([0-9.]*\).*"/\1/p' project.godot)"
          python3 scripts/ci/make_export_presets.py "$BUNDLE_ID" "${VERSION:-0.1.0}" "${{ github.run_number }}"

      - name: Export macOS app
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT" --headless --path . --export-release "macOS" build/godot-export.zip 2>&1 | tee export.log
          test -f build/godot-export.zip

      # Godot экспортирует без подписи; подписываем системным codesign (ad-hoc): встроенный
      # подписчик Godot не читает Info.plist фреймворка и оставляет неполную подпись.
      - name: Verify, sign (ad-hoc) and pack bundle
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify && ditto -x -k build/godot-export.zip verify
          APP="$(find verify -maxdepth 2 -name '*.app' -type d | head -1)"
          test -n "$APP"
          echo "App: $APP"
          FW="$APP/Contents/Frameworks/libovosch_ble.macos.template_release.framework"
          plutil -lint "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist" | grep -q NSBluetoothAlwaysUsageDescription
          test -d "$FW"
          plutil -lint "$FW/Resources/Info.plist"
          lipo -info "$APP/Contents/MacOS/"* | grep -q "x86_64 arm64"
          lipo -info "$FW/libovosch_ble.macos.template_release" | grep -q "x86_64 arm64"
          codesign --force --sign - --timestamp=none "$FW"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" build/ovosch-rider-macos.zip
          unzip -l build/ovosch-rider-macos.zip | tail -1

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ovosch-rider-macos
          path: build/ovosch-rider-macos.zip
          if-no-files-found: error
