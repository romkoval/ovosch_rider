name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: 4.7-stable

jobs:
  tests:
    name: GUT tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # полная история для проверки сообщений коммитов (REQ-INF-03 крит. 2)

      - name: Secrets scan
        run: ./scripts/check_secrets.sh

      - name: Commit messages contain REQ-ID
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=0 2>/dev/null || true
            RANGE="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="HEAD~0..HEAD"
          fi
          ./scripts/check_commit_messages.sh "$RANGE"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Project opens headless
        run: ~/godot/godot --headless --path . --import

      - name: Run GUT tests
        run: GODOT=~/godot/godot ./scripts/test.sh

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit
          path: tests/reports/results.xml
          if-no-files-found: ignore
